server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Ассеты Vite содержат хеш в имени, поэтому кэшируются навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html кэшировать нельзя: иначе после переразвёртывания браузер
    # тянет старый файл и просит ассеты, которых в новой сборке уже нет.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router обслуживает маршруты на клиенте. Без этого перезагрузка
    # страницы на /dispatcher/revenue возвращает 404 от nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
