# TazaBAK EcoFin — полный стенд одной командой:
#
#   docker compose up --build
#
# Frontend  http://localhost:5173
# Backend   http://localhost:8000/docs
#
# Первая сборка долгая: ставится torch и запекаются веса YOLO и CLIP. Дальше
# всё берётся из слоёв Docker, и стенд поднимается за секунды.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tazabak
      POSTGRES_USER: tazabak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tazabak}
    volumes:
      - tazabak-postgres:/var/lib/postgresql/data
    ports:
      # Наружу — только для отладки с хоста (psql, DBeaver). Backend ходит
      # внутри сети Docker по имени сервиса, порт хоста не задействует.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tazabak -d tazabak"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: tazabak-ecofin-backend
    ports:
      - "8000:8000"
    environment:
      # postgresql:// нормализуется на драйвер psycopg (v3) в app/config.py,
      # писать +psycopg в адресе здесь не обязательно.
      DATABASE_URL: postgresql://tazabak:${POSTGRES_PASSWORD:-tazabak}@db:5432/tazabak
      APP_ENV: ${APP_ENV:-development}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DISPATCHER_API_KEY: ${DISPATCHER_API_KEY:-123}
      # Фронтенд ходит с другого порта, значит для браузера это чужой источник.
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # Без ключа советы Баки собираются локальными правилами по тем же
      # числам — стенд остаётся рабочим и без интернета.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      YOLO_DEVICE: cpu
    volumes:
      # База переехала в сервис db; здесь остаются только загруженные
      # изображения — они не строки таблиц и в дампе базы не нужны.
      - tazabak-static:/app/static
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Адрес, по которому backend виден из браузера, а не из сети Docker:
        # запрос уходит со страницы, а не из контейнера frontend.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: tazabak-ecofin-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tazabak-postgres:
  tazabak-static:
