name: CI

# Проверка идёт на каждый push и pull request: экономика проекта держится на
# формулах, и сломанный расчёт должен падать здесь, а не на защите.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Тесты backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Системные библиотеки для OpenCV
        # ultralytics тянет opencv, а в образе ubuntu-latest нет libGL —
        # без этого падает уже импорт, до единого теста.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Установка зависимостей
        # CPU-сборка torch: раннер без видеокарты, а колесо с CUDA качается
        # в несколько раз дольше.
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements-dev.txt

      - name: pytest
        env:
          # Тесты не должны ходить в сеть: без ключа советы Баки собираются
          # локальными правилами, и это отдельно покрыто тестом.
          GEMINI_API_KEY: ''
        run: python -m pytest -q

  frontend:
    name: Типы и сборка frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci, а не npm install: собираем ровно те версии, на которых
      # проверялись экраны.
      - run: npm ci

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Продакшен-сборка
        run: npm run build

  docker:
    name: Сборка образов
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Образы только собираются и никуда не публикуются: цель — поймать
      # поломку Dockerfile до того, как она обнаружится при развёртывании.
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
